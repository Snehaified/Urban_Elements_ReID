MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: "models/checkpoints"
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'part_attention_vit'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  # If your TransReID codebase supports these, turn them ON for c004
  # SIE_CAMERA: True 
  # SIE_VIEW: True

INPUT:
  SIZE_TRAIN: [224, 224]      # Perfect 14x14 patch grid for the ViT
  SIZE_TEST: [224, 224]
  DO_FLIP: False              # CRITICAL: Traffic signs are strictly asymmetrical!
  REA:
    ENABLED: False            # Keep off to preserve micro-features
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]
  CJ:
    ENABLED: True
    PROB: 0.8
    BRIGHTNESS: 0.3       # Forces the ViT to learn shape/texture, not absolute brightness
    CONTRAST: 0.2
    SATURATION: 0.1
    HUE: 0.0          
  
  PERSPECTIVE:
    ENABLED: False
  ROTATION:
    ENABLED: False

DATASETS:
  TRAIN: ('UAM_Urban_Combined',)
  TEST: ('UAM_Urban_Combined',)
  ROOT_DIR: '.'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'AdamW'     # Required for ViT stability
  MAX_EPOCHS: 120             # Give the ViT time to converge
  BASE_LR: 0.0002             # 3e-4 sweet spot
  IMS_PER_BATCH: 64
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 10           # Crucial to prevent catastrophic forgetting
  WARMUP_FACTOR: 0.01
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 10
  LOG_PERIOD: 60
  EVAL_PERIOD: 10
  WEIGHT_DECAY: 0.01          # Stronger regularization for AdamW
  WEIGHT_DECAY_BIAS: 0.01
  BIAS_LR_FACTOR: 2
  SEED: 1234

TEST:
  EVAL: True
  IMS_PER_BATCH: 128
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'after'          # Evaluate on the normalized hypersphere
  FEAT_NORM: True


LOG_ROOT: 'models/'
TB_LOG_ROOT: './tb_log/'
LOG_NAME: 'E4_cj_224224'